# Egypt national curriculum, Science, Primary 4 to Preparatory 2 (grades 4 to 8). DRAFT.
#
# What is taken from the curriculum: the topics, their grade and their term, as listed in the unit, chapter
# and lesson titles of the books in use. Titles are shortened into plain topic names. No textbook text is copied.
# Each topic names its source below. None of the sources is the ministry's own website, and most are
# secondary (workbooks, assessment books, review booklets and news articles that list the contents of the
# ministry book), so check a topic against the current printed book before relying on it.
#
# Read this before trusting Primary 4 to 6. In 2026/27 the ministry replaced the Primary 4, 5 and 6 science
# books with a new chapter-based curriculum. Term 1 of those three grades below follows the new books.
# The term 2 books of the new curriculum were not published when this file was written (November 2026).
# For Primary 4, 5 and 6 term 2 this file therefore lists the topics that were taught in term 2 up to 2025/26
# (the earlier "Education 2.0" books). Every such topic is marked `verified: false`, 14 topics in all. They are
# real topics from real books, but they are very likely to be replaced when the new term 2 books appear.
# Preparatory 1 follows the curriculum introduced in 2024/25 and Preparatory 2 the one introduced in 2025/26.
# Some chapters and lessons are split into two topics here. The split is ours, made from the lesson headings
# and summaries that the sources show.
#
# What is NOT from the curriculum: the `requires` links. The curriculum does not publish which topic
# depends on which. These links were drafted by the authors of this software and have not yet been
# reviewed by a teacher. The trace-back is only as good as these links.
#
# We graph the school's curriculum. We never change it.
