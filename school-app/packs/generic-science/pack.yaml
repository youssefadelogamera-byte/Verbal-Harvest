  - {id: human-body-systems, label: {en: Human body systems}, strand: living-things, grade: 5, requires: [animal-groups], skills: []}
  - {id: cells, label: {en: Cells as building blocks}, strand: living-things, grade: 6, requires: [human-body-systems], skills: []}
  - {id: photosynthesis, label: {en: Photosynthesis}, strand: living-things, grade: 6, requires: [plant-parts, food-chains], skills: [explaining-reasoning]}
  - {id: ecosystems, label: {en: Ecosystems and populations}, strand: living-things, grade: 7, requires: [food-chains, photosynthesis], skills: [working-with-data]}
