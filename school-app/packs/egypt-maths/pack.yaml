# Egypt national curriculum, Mathematics, Primary 4 to Preparatory 2 (grades 4 to 8). DRAFT.
#
# What is taken from the curriculum: the topics, their grade and their term, as listed in the unit and
# concept titles of the student books. Titles are shortened into plain topic names. No textbook text is copied.
# Each topic names its source below. None of the sources is the ministry's own website, so check a topic
# against the current printed book before relying on it. Topics marked `verified: false` were not read from
# any source and come from general knowledge of the grade.
#
# What is NOT from the curriculum: the `requires` links. The curriculum does not publish which topic
# depends on which. These links were drafted by the authors of this software and have not yet been
# reviewed by a teacher. The trace-back is only as good as these links.
#
# We graph the school's curriculum. We never change it.
