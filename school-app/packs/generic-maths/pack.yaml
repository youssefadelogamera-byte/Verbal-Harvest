# Generic school mathematics, grades 1 to 8.
# This map is NOT tied to any one country or national syllabus. It lists widely taught topics and the
# order in which they depend on each other. Athar graphs a curriculum; it does not invent or
# change one. A school can replace this file with its own pack in the same format.
id: generic-maths
name: School mathematics, grades 1 to 8
subject: maths
subject_label: {en: Mathematics}
grades: [1, 8]
languages: [en]

strands:
  - {id: number, label: {en: Number and place value}}
  - {id: operations, label: {en: Operations and calculation}}
  - {id: fractions-and-ratio, label: {en: "Fractions, decimals, ratio and proportion"}}
  - {id: measurement, label: {en: Measurement}}
  - {id: geometry, label: {en: Geometry and space}}
  - {id: data, label: {en: Data and probability}}
  - {id: algebra, label: {en: Patterns and algebra}}

skills:
  - {id: spatial-reasoning, label: {en: Spatial reasoning}}
  - {id: pattern-finding, label: {en: Pattern finding}}
  - {id: explaining-reasoning, label: {en: Explaining reasoning}}
  - {id: persistence-on-hard-problems, label: {en: Persistence on hard problems}, kind: disposition}
  - {id: working-with-data, label: {en: Working with data}}
  - {id: estimating-and-checking, label: {en: Estimating and checking}}

approaches:
  - {id: concrete_objects, label: {en: Hands-on objects}}
  - {id: visual_models, label: {en: Diagrams and visual models}}
  - {id: worked_examples, label: {en: Worked examples}}
