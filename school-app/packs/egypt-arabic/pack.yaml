# Egypt national curriculum, Arabic language (first language), Primary 4 to Preparatory 2 (grades 4 to 8). DRAFT.
#
# What is taken from the curriculum: the topics, their grade and their term, as named in published lists of
# the units and lessons of the ministry books (grammar rules, spelling rules, writing and speaking tasks,
# and the kinds of text studied). The lists describe the revised books first taught in 2025/26; workbook
# pages for 2026/27 show the same units for Primary 5 and 6, term 1. Names are shortened into plain topic
# names in our own words. No textbook text is copied, and titles of reading passages and poems are not used.
#
# How good the sources are: NONE of them is a ministry book or the ministry's own website (it refused our
# requests, and no scanned copy of the current Arabic books was found). Every source is secondary: Arabic
# news articles that list the lessons (some say they repeat a ministry announcement) and articles that
# describe the contents of commercial workbooks. Each source was read through an automatic page reader, so
# a name may have been garbled. Preparatory 1 term 2 and Preparatory 2 term 2 rest on partial lists that
# name examples only, so topics are likely missing there. Check every topic against the printed book.
#
# Reading and poem topics are the lesson kinds the sources name (a listening text, reading texts and a poem
# in every unit); the wording of the skill is ours. Topics marked `verified: false` are not named in any
# source we read and come from general knowledge of the grade.
#
# What is NOT from the curriculum: the `requires` links. The curriculum does not publish which topic
# depends on which. These links were drafted by the authors of this software and have not yet been
# reviewed by a teacher. The trace-back is only as good as these links.
#
# We graph the school's curriculum. We never change it.
