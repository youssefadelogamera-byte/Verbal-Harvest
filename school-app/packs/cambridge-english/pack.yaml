# Cambridge English, Years 1 to 11 (Cambridge Primary, Lower Secondary and IGCSE). DRAFT.
# Written for Learning International Schools, Saudi Arabia, which teaches Cambridge with Marshall Cavendish books.
#
# What is taken from the curriculum: topic names follow the strands of the Cambridge curriculum frameworks
# (Primary English 0058, Lower Secondary English 1111, IGCSE First Language English 0500). They were written from general knowledge of those frameworks, not copied
# from them, so every topic is marked `verified: false` until a teacher checks it.
#
# Grade = Cambridge stage/year: 1 to 6 Primary, 7 to 9 Lower Secondary, 10 and 11 IGCSE.
# Term = the term of a three-term year in a typical scheme of work. Check each one against the order of the
# units in the school's Marshall Cavendish books and move a topic to its real term.
#
# What is NOT from the curriculum: the `requires` links. Cambridge does not publish which topic depends on
# which. These links were drafted by the authors of this software and have not been reviewed by a teacher.
# The trace-back is only as good as these links.
#
# We graph the school's curriculum. We never change it.
